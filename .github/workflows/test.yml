on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 14.x
        uses: actions/setup-node@v2
        with:
          node-version: "14.x"
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies and run tests
        run: |
          yarn
          yarn test
          yarn build
